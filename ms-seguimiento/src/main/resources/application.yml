server:
  port: 8084

spring:
  application:
    name: ms-seguimiento
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/db_seguimiento}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 3000
        spring.json.add.type.headers: false
    consumer:
      group-id: ms-seguimiento
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.plataforma.common.event.DomainEvent
        spring.json.trusted.packages: com.plataforma.common.event
        spring.json.use.type.headers: false
