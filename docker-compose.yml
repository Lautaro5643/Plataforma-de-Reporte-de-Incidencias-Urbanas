# Infraestructura local: una base PostgreSQL por microservicio (Database per Service) + Kafka.
# Los microservicios se ejecutan fuera de Docker (mvn spring-boot:run) y se conectan por localhost.
services:
  db_usuarios:
    image: postgres:17
    container_name: db_usuarios
    environment:
      POSTGRES_DB: db_usuarios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - usuarios_data:/var/lib/postgresql/data

  db_incidencias:
    image: postgres:17
    container_name: db_incidencias
    environment:
      POSTGRES_DB: db_incidencias
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - incidencias_data:/var/lib/postgresql/data

  db_asignaciones:
    image: postgres:17
    container_name: db_asignaciones
    environment:
      POSTGRES_DB: db_asignaciones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - asignaciones_data:/var/lib/postgresql/data

  db_seguimiento:
    image: postgres:17
    container_name: db_seguimiento
    environment:
      POSTGRES_DB: db_seguimiento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - seguimiento_data:/var/lib/postgresql/data

  db_zonas:
    image: postgres:17
    container_name: db_zonas
    environment:
      POSTGRES_DB: db_zonas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - zonas_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  usuarios_data:
  incidencias_data:
  asignaciones_data:
  seguimiento_data:
  zonas_data:
